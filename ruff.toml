target-version = "py311"
line-length = 100
include = ["src/animation/**/*.py", "tests/**/*.py"]
extend-exclude = ["lean"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "RUF"]

[lint.isort]
known-first-party = ["operations", "regions", "replay", "replay_plan", "replay_steps", "trace_data"]
